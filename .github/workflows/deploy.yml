name: Test and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the React app
        run: npm run build

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install Jekyll dependencies
        working-directory: docs
        run: bundle install

      - name: Build the docs site
        working-directory: docs
        run: bundle exec jekyll build

      - name: Build Marp slides
        working-directory: docs/proposal
        run: npx --yes @marp-team/marp-cli@latest -I slides --theme slides/dracula.css -o ../_site/proposal/slides

      - name: Copy slide assets
        working-directory: docs/proposal
        run: |
          if [ -d slides/assets ]; then
            mkdir -p ../_site/proposal/slides
            cp -r slides/assets ../_site/proposal/slides/
          fi

      - name: Merge the app into the docs site under /app
        run: |
          mkdir -p docs/_site/app
          cp -r dist/. docs/_site/app/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

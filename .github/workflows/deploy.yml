name: Pages deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install Jekyll dependencies
        working-directory: docs/proposal
        run: bundle install

      - name: Build the site
        working-directory: docs/proposal
        run: bundle exec jekyll build

      - name: Set up Node.js (for Marp CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Marp slides
        working-directory: docs/proposal
        run: npx --yes @marp-team/marp-cli@latest -I slides --theme slides/dracula.css -o _site/slides

      - name: Copy slide assets
        working-directory: docs/proposal
        run: |
          if [ -d slides/assets ]; then
            mkdir -p _site/slides
            cp -r slides/assets _site/slides/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/proposal/_site'

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build-docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment 
        uses: actions/deploy-pages@v4
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="system-ui, Arial, sans-serif">
  <!-- window background -->
  <rect width="900" height="500" fill="#282a36"/>
  <rect x="120" y="40" width="660" height="400" rx="12" fill="#ffffff" stroke="#44475a" stroke-width="2"/>

  <!-- browser chrome -->
  <circle cx="140" cy="60" r="8" fill="#ff5555"/>
  <circle cx="162" cy="60" r="8" fill="#f1fa8c"/>
  <circle cx="184" cy="60" r="8" fill="#50fa7b"/>

  <!-- react logo (simplified atom) -->
